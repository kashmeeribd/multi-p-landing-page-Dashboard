<!-- [Body] Start -->

<body>
  <!-- [ Pre-loader ] start -->
  <div class="loader-bg fixed inset-0 bg-white dark:bg-themedark-cardbg z-[1034]">
    <div class="loader-track h-[5px] w-full inline-block absolute overflow-hidden top-0">
      <div
        class="loader-fill w-[300px] h-[5px] bg-primary-500 absolute top-0 left-0 animate-[hitZak_0.6s_ease-in-out_infinite_alternate]">
      </div>
    </div>
  </div>
  <!-- [ Pre-loader ] End -->

  <div class="auth-main relative">
    <div class="auth-wrapper v1 flex items-center w-full h-full min-h-screen">
      <div class="auth-form flex items-center justify-center grow flex-col min-h-screen relative p-6 ">
        <div class="w-full max-w-[350px] relative">
          <div class="auth-bg ">
            <span
              class="absolute top-[-100px] right-[-100px] w-[300px] h-[300px] block rounded-full bg-theme-bg-1 animate-[floating_7s_infinite]"></span>
            <span
              class="absolute top-[150px] right-[-150px] w-5 h-5 block rounded-full bg-primary-500 animate-[floating_9s_infinite]"></span>
            <span
              class="absolute left-[-150px] bottom-[150px] w-5 h-5 block rounded-full bg-theme-bg-1 animate-[floating_7s_infinite]"></span>
            <span
              class="absolute left-[-100px] bottom-[-100px] w-[300px] h-[300px] block rounded-full bg-theme-bg-2 animate-[floating_9s_infinite]"></span>
          </div>
          <div class="card sm:my-12  w-full shadow-none">
            <div class="card-body !p-10">
              <div class="text-center mb-8">
                <a href="#"><img src="../assets/images/logo-black.png" alt="img" class="mx-auto auth-logo" /></a>
              </div>
              <h4 class="text-center font-medium mb-4">Sign up</h4>
              <form id="registerForm">
                <div class="mb-4">
                  <label for="name" class="block text-sm font-medium text-gray-700">Full Name</label>
                  <input type="text" id="name" name="name" placeholder="Enter your full name" required
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm">
                </div>

                <div class="mb-4">
                  <label for="email" class="block text-sm font-medium text-gray-700">Email address</label>
                  <input type="email" id="email" name="email" placeholder="Enter your email" required
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm">
                </div>

                <div class="mb-6">
                  <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                  <input type="password" id="password" name="password"
                    placeholder="Enter your password (min 6 characters)" required minlength="6"
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm">
                </div>

                <div class="flex items-center justify-center">
                  <button type="submit" id="registerSubmitBtn"
                    class="w-full text-white bg-primary-500 hover:bg-primary-600 focus:ring-4 focus:outline-none focus:ring-primary-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center transition duration-150">
                    Sign up
                  </button>
                </div>
              </form>

              <div class="flex justify-between items-end flex-wrap mt-4">
                <h6 class="font-medium mb-0">Already have an Account?</h6>
                <a href="login-v1.html" class="text-primary-500">Login</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- [ Main Content ] end -->



  <script>
    // 🚨 API Endpoint for Registration (আপনার সার্ভারের রুট)
    const REGISTER_API_URL = 'https://api.kashmeeri.com/api/auth/register';
    const LOGIN_PAGE_URL = 'login-v1.html';

    const registerForm = document.getElementById('registerForm');
    // নতুন নাম ইনপুট
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('registerSubmitBtn');

    // ফর্ম সাবমিশন হ্যান্ডেলার
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = nameInput.value; // নাম সংগ্রহ করা
      const email = emailInput.value;
      const password = passwordInput.value;

      // বাটনকে লোডিং অবস্থায় নিয়ে যাওয়া
      submitBtn.textContent = 'Registering...';
      submitBtn.disabled = true;

      try {
        // ব্যাকএন্ডে POST রিকোয়েস্ট পাঠানো
        const response = await fetch(REGISTER_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          // নাম সহ সমস্ত ডেটা JSON বডিতে পাঠানো
          body: JSON.stringify({ name, email, password }),
        });

        const data = await response.json();

        if (!response.ok) {
          const errorMessage = data.message || 'Registration failed due to unknown error.';
          throw new Error(errorMessage);
        }

        // সফল রেজিস্ট্রেশন হ্যান্ডেল করা
        alert(`Registration successful for ${data.user || name}! You can now log in.`);
        window.location.href = LOGIN_PAGE_URL;

      } catch (error) {
        console.error("Registration Error:", error.message);
        alert(`Registration Failed: ${error.message}`);

        // এরর হ্যান্ডেল করার পর বাটন ঠিক করা
        submitBtn.textContent = 'Sign up';
        submitBtn.disabled = false;
      }
    });
  </script>

</body>
